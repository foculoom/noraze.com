<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t1 d1">
  <title id="t1">Spark shuffle fetch data flow</title>
  <desc id="d1">Diagram of map-stage executors writing shuffle blocks to local disk, reduce tasks fetching across the network, and the four failure points: executor death, disk pressure, network timeout, and corrupt blocks.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fafafa"/>
  <!-- Map stage -->
  <text x="40" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Map stage (writes shuffle blocks to local disk)</text>
  <g font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a">
    <rect x="40" y="50" width="130" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="105" y="78" text-anchor="middle">Executor A</text>
    <text x="105" y="96" text-anchor="middle" font-size="10" fill="#4b5563">map output blocks</text>
    <rect x="190" y="50" width="130" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="255" y="78" text-anchor="middle">Executor B</text>
    <text x="255" y="96" text-anchor="middle" font-size="10" fill="#4b5563">map output blocks</text>
    <rect x="340" y="50" width="130" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="405" y="78" text-anchor="middle">Executor C</text>
    <text x="405" y="96" text-anchor="middle" font-size="10" fill="#4b5563">map output blocks</text>
  </g>
  <!-- local disk -->
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#374151">
    <text x="105" y="128" text-anchor="middle">local disk ✓</text>
    <text x="255" y="128" text-anchor="middle">local disk ⚠ full</text>
    <text x="405" y="128" text-anchor="middle">local disk ✓</text>
  </g>
  <!-- fetch arrows -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M105,130 C105,180 255,180 255,225"/>
    <path d="M255,130 L255,225"/>
    <path d="M405,130 C405,180 255,190 255,225"/>
  </g>
  <text x="170" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#dc2626">fetch (network)</text>
  <text x="268" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#dc2626">fetch</text>
  <text x="335" y="195" font-family="-apple-system, sans-serif" font-size="10" fill="#dc2626">fetch</text>
  <!-- Reduce stage -->
  <text x="40" y="240" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Reduce stage (fetches blocks across the network)</text>
  <g font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a">
    <rect x="190" y="225" width="130" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="255" y="253" text-anchor="middle">Reduce task</text>
    <text x="255" y="271" text-anchor="middle" font-size="10" fill="#4b5563">fetch + aggregate</text>
  </g>
  <!-- failure points -->
  <text x="40" y="320" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Four failure points →</text>
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#374151">
    <text x="40" y="344">1. Executor died (preempt / autoscale / OOM) — block source gone</text>
    <text x="40" y="364">2. Disk pressure on source node — shuffle service crashes or returns corrupt blocks</text>
    <text x="40" y="384">3. Network timeout / connection exhaustion — fetch drops mid-transfer</text>
    <text x="40" y="404">4. Corrupt or oversized block — detectCorrupt + retry, then FetchFailedException</text>
  </g>
</svg>