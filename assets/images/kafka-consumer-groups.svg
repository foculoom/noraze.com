<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="t1 d1">
  <title id="t1">Kafka consumer group: partitions are the unit of parallelism</title>
  <desc id="d1">A topic with 4 partitions distributed across a consumer group of 4 consumers (one partition each). A 5th consumer would idle, demonstrating the partitions-as-parallelism-ceiling rule: consumers &gt; partitions → idle.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="900" height="490" fill="#fafafa"/>
  <!-- Topic = 4 partitions -->
  <text x="40" y="40" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Topic "events" — 4 partitions (ordered logs, parallelism ceiling = 4)</text>
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#0f172a">
    <rect x="40" y="55" width="180" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="130" y="80" text-anchor="middle">Partition 0  [o1,o2,o3…]</text>
    <rect x="240" y="55" width="180" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="330" y="80" text-anchor="middle">Partition 1  [o1,o2,o3…]</text>
    <rect x="440" y="55" width="180" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="530" y="80" text-anchor="middle">Partition 2  [o1,o2,o3…]</text>
    <rect x="640" y="55" width="180" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="730" y="80" text-anchor="middle">Partition 3  [o1,o2,o3…]</text>
  </g>
  <!-- assignment arrows (each partition → one consumer) -->
  <g stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <path d="M130,95 L130,175"/>
    <path d="M330,95 L335,175"/>
    <path d="M530,95 L540,175"/>
    <path d="M730,95 L745,175"/>
  </g>
  <!-- Consumer group -->
  <text x="40" y="135" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Consumer group (4 consumers share the topic; each partition → exactly one consumer)</text>
  <g font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a">
    <rect x="40" y="175" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="130" y="198" text-anchor="middle" font-weight="700">Consumer 1</text>
    <text x="130" y="218" text-anchor="middle" font-size="10" fill="#475569">owns P0</text>
    <rect x="245" y="175" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="335" y="198" text-anchor="middle" font-weight="700">Consumer 2</text>
    <text x="335" y="218" text-anchor="middle" font-size="10" fill="#475569">owns P1</text>
    <rect x="450" y="175" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="540" y="198" text-anchor="middle" font-weight="700">Consumer 3</text>
    <text x="540" y="218" text-anchor="middle" font-size="10" fill="#475569">owns P2</text>
    <rect x="655" y="175" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="745" y="198" text-anchor="middle" font-weight="700">Consumer 4</text>
    <text x="745" y="218" text-anchor="middle" font-size="10" fill="#475569">owns P3</text>
  </g>
  <!-- idle consumer -->
  <rect x="40" y="255" width="220" height="75" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="4,3"/>
  <text x="150" y="278" text-anchor="middle" font-weight="700" font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a">Consumer 5</text>
  <text x="150" y="298" text-anchor="middle" font-size="10" fill="#dc2626" font-family="-apple-system, sans-serif">IDLE (no partition)</text>
  <text x="150" y="318" text-anchor="middle" font-size="10" fill="#dc2626" font-family="-apple-system, sans-serif">consumers &gt; partitions → idle</text>
  <!-- rebalance note -->
  <rect x="40" y="345" width="820" height="55" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="450" y="368" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a" font-weight="700">Rebalance: when a consumer joins/leaves/dies, partitions are reassigned and the group halts until it completes.</text>
  <text x="450" y="388" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">Triggers: missed heartbeats (session.timeout.ms) OR processing longer than max.poll.interval.ms between polls → pipeline stalls.</text>
  <!-- offsets note -->
  <text x="40" y="425" font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a" font-weight="700">Offsets = position per partition. Commit after processing → at-least-once (default); commit before → at-most-once.</text>
  <text x="40" y="448" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">Different consumer groups read the whole topic independently at their own offset — the pub/sub property.</text>
</svg>