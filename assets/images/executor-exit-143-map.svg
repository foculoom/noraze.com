<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t2 d2">
  <title id="t2">Spark executor exit code map</title>
  <desc id="d2">Decision map for executor exit code 143 (SIGTERM): three causes — autoscale scale-down, YARN OOM kill, and GC death spiral — and the diagnostic question for each.</desc>
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fafafa"/>
  <!-- root -->
  <rect x="360" y="20" width="180" height="50" rx="8" fill="#1e293b"/>
  <text x="450" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fff">Executor exit code 143</text>
  <text x="450" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">= SIGTERM (128 + 15)</text>
  <!-- question -->
  <text x="450" y="92" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#475569" font-style="italic">Who sent the SIGTERM, and why?</text>
  <!-- three branches -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#arr2)">
    <path d="M420,100 L160,140"/>
    <path d="M450,100 L450,140"/>
    <path d="M480,100 L740,140"/>
  </g>
  <!-- branch 1: autoscale -->
  <g font-family="-apple-system, sans-serif">
    <rect x="40" y="140" width="240" height="90" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="160" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Autoscale scale-down</text>
    <text x="160" y="180" text-anchor="middle" font-size="10" fill="#374151">idle executor removed</text>
    <text x="160" y="200" text-anchor="middle" font-size="10" fill="#374151">dynamicAllocation.enabled</text>
    <text x="160" y="216" text-anchor="middle" font-size="10" fill="#374151">minExecutors / maxExecutors</text>
  </g>
  <text x="160" y="250" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#16a34a">Expected if executor was idle</text>
  <!-- branch 2: YARN OOM -->
  <g font-family="-apple-system, sans-serif">
    <rect x="330" y="140" width="240" height="90" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="450" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">YARN OOM kill</text>
    <text x="450" y="180" text-anchor="middle" font-size="10" fill="#374151">container memory exceeded</text>
    <text x="450" y="200" text-anchor="middle" font-size="10" fill="#374151">executor.memory + overhead</text>
    <text x="450" y="216" text-anchor="middle" font-size="10" fill="#374151">&gt; YARN container limit</text>
  </g>
  <text x="450" y="250" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#dc2626">137 if YARN escalated to SIGKILL</text>
  <!-- branch 3: GC death spiral -->
  <g font-family="-apple-system, sans-serif">
    <rect x="620" y="140" width="240" height="90" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="740" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">GC death spiral</text>
    <text x="740" y="180" text-anchor="middle" font-size="10" fill="#374151">repeated full GC, no progress</text>
    <text x="740" y="200" text-anchor="middle" font-size="10" fill="#374151">not OOM, but unhealthy</text>
    <text x="740" y="216" text-anchor="middle" font-size="10" fill="#374151">executor marked dead</text>
  </g>
  <text x="740" y="250" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#d97706">Check executor log for full GCs</text>
  <!-- diagnostic -->
  <rect x="40" y="290" width="820" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="60" y="314" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Diagnostic steps (Synapse Monitor → Spark application)</text>
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#374151">
    <text x="60" y="336">1. Exit code in executor log: 143 = SIGTERM, 137 = SIGKILL</text>
    <text x="60" y="356">2. Was the executor idle? (History Server → executor usage) — yes = autoscale; no = problem</text>
    <text x="60" y="376">3. Repeated full GCs in executor log before exit? — yes = GC spiral → tune memory / parallelism</text>
    <text x="60" y="394">4. Exit coincides with heavy shuffle + memory spike? — yes = YARN OOM → raise memory / reduce working set</text>
  </g>
</svg>